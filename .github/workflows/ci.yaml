name: CI
on:
  push:
    branches: [ master, production, develop, release/*, test/* ]
  pull_request:
    branches: [ master, production, release/* ]
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.76.0
jobs:
  rustfmt:
    name: Checks / Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v4
      - name: Install Rust Toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt
          rustup override set ${{ env.RUST_TOOLCHAIN }}
      - name: Format Check
        run: cargo fmt --all -- --check
  clippy:
    name: Checks / Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v4
      - name: Install Rust Toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy
          rustup override set ${{ env.RUST_TOOLCHAIN }}
      - name: Lint Check
        run: make clippy
  test:
    name: Tests / Build & Test
    needs: [ rustfmt, clippy ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-latest, windows-2022 ]
      fail-fast: false
      max-parallel: 3
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install LLVM on Ubuntu
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
          echo "CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Install LLVM on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm
          echo "CLANG=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
      - name: Install LLVM on Windows
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          scoop install llvm yasm
          # Upstream Yasm 1.3.0 requires MSVCR100.dll (Visual C++ 2010).
          choco install vcredist2010 --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "VC++ 2010 runtime installation failed" }
          & "$env:USERPROFILE\scoop\shims\yasm.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Yasm cannot start" }
          echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Rust Toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup override set ${{ env.RUST_TOOLCHAIN }}
          rustup target add riscv64imac-unknown-none-elf
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build
        run: make build
      - name: Unit Testing
        run: make test
